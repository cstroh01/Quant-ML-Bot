# Spec 066 template. Install in the PRIVATE companion repo as .github/workflows/restore-drill.yml.
# Dispatch-only restore drill: restores the newest state artifact for one profile into a scratch
# directory and compares it with the ops-state branch. Read-only: no push, no issue, no secret, no
# broker. Evidence is uploaded as an artifact. No concurrency group on purpose: joining the
# writers' group would make this run the group's pending run and cancel a pending PAPER/Fidelity run.
name: restore-drill
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "State to drill"
        required: true
        type: choice
        options: [paper_small, paper_large, live_fidelity]
permissions:
  contents: read
  actions: read
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROFILE: ${{ inputs.profile }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Before any checkout, so a writer cannot finish between the state snapshot and the check.
      # Fails closed on any gh error except a workflow that is not installed.
      - name: Refuse while a state writer is queued or running
        run: |
          for wf in paper-loop.yml fidelity-preview.yml fidelity-live.yml; do
            filter='[.[] | select(.status != "completed")] | length'
            if ! active=$(gh run list -R "$GITHUB_REPOSITORY" -w "$wf" -L 20 --json status --jq "$filter" 2>&1); then
              # Not installed: gh reports "workflow X not found on the default branch" (HTTP 404).
              case "$active" in *"not found on the default branch"*|*"could not find any workflows named"*) continue ;; esac
              echo "::error::cannot check $wf: $active"; exit 1
            fi
            if [ "$active" != "0" ]; then echo "::error::$wf is active; dispatch the drill later"; exit 1; fi
          done
      - name: Pin the ops-state snapshot
        run: echo "STATE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/ops-state" --jq .object.sha)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cstroh01/Quant-ML-Bot
          ref: ${{ vars.QMB_PINNED_SHA }}
          path: qmb
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.STATE_SHA }}
          path: state
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: pip install -r qmb/requirements.txt
      - name: Download the newest backup for this profile
        run: |
          case "$PROFILE" in
            live_fidelity) prefixes='["fidelity-live-state-","fidelity-state-"]' ;;
            *) prefixes="[\"state-$PROFILE-\"]" ;;
          esac
          name=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[]' \
            | jq -rs --argjson p "$prefixes" \
              '[.[] | select(.expired | not) | select(.name as $n | any($p[]; . as $q | $n | startswith($q)))]
               | sort_by(.created_at) | last | .name // empty')
          test -n "$name" || { echo "::error::no unexpired backup for $PROFILE"; exit 1; }
          echo "backup artifact: $name"
          gh run download "${name##*-}" -R "$GITHUB_REPOSITORY" -n "$name" -D "$RUNNER_TEMP/backup"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"
      - name: Restore into scratch and compare
        working-directory: qmb
        run: >-
          python scripts/restore_drill.py --primary "$GITHUB_WORKSPACE/state/$PROFILE"
          --backup "$RUNNER_TEMP/backup" --profile "$PROFILE" --evidence "$RUNNER_TEMP/restore-drill.json"
      # A writer that pushed during the drill makes the comparison stale: refuse, never FAIL.
      # Only meaningful once a snapshot SHA was recorded.
      - name: Refuse if ops-state moved during the drill
        if: ${{ always() && env.STATE_SHA != '' }}
        run: |
          now=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/ops-state" --jq .object.sha)
          if [ "$now" != "$STATE_SHA" ]; then echo "::error::ops-state moved; rerun the drill"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: restore-drill-${{ inputs.profile }}-${{ github.run_id }}
          path: ${{ runner.temp }}/restore-drill.json
          retention-days: 90
