# 057 T017 / D-5a: DORMANT TEMPLATE. Private companion main only; Camden installs and starts it.
# Dispatch only, no schedule, no preview, place or arming input. At most two probes ever (counted
# from persisted records). Runs only while HALTED exists and never writes it.
name: fidelity-login-probe
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PROBE to spend one of the two login probes
        required: true
permissions:
  contents: write
  issues: write
# Same group as installed PAPER and preview: all write the same ops-state branch.
concurrency:
  group: paper-loop
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'cstroh01/Quant-ML-Bot-private' &&
      github.event.repository.private == true && github.ref == 'refs/heads/main' &&
      github.actor == 'cstroh01' && inputs.confirm == 'PROBE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIN: ${{ vars.QMB_FIDELITY_PIN }}
      QMB_STATE_DIR: ${{ github.workspace }}/state/live_fidelity
    steps:
      - name: Require immutable public-main ancestor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          pin=os.environ['PIN']
          if not re.fullmatch('[0-9a-f]{40}',pin): raise SystemExit('Invalid source pin')
          r=subprocess.run(['gh','api','repos/cstroh01/Quant-ML-Bot/compare/'+pin+'...main'],capture_output=True,text=True,check=True)
          if json.loads(r.stdout)['status'] not in ('ahead','identical'): raise SystemExit('Pin outside main')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cstroh01/Quant-ML-Bot
          ref: ${{ vars.QMB_FIDELITY_PIN }}
          path: qmb
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops-state
          path: state
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install existing runtime and audited SDK lock without credentials
        run: |
          pip install -r qmb/requirements.txt
          pip install --require-hashes --only-binary=:all: -r qmb/requirements-fidelity-host.txt
      - name: Login probe; marker persisted before login
        working-directory: qmb
        env:
          QMB_FIDELITY_PROFILES_JSON: ${{ secrets.QMB_FIDELITY_PROFILES_JSON }}
          FIDELITY_LIVE_USERNAME: ${{ secrets.FIDELITY_LIVE_USERNAME }}
          FIDELITY_LIVE_PASSWORD: ${{ secrets.FIDELITY_LIVE_PASSWORD }}
          FIDELITY_LIVE_TOTP: ${{ secrets.FIDELITY_LIVE_TOTP }}
          FIDELITY_LIVE_ACCOUNT: ${{ secrets.FIDELITY_LIVE_ACCOUNT }}
          FIDELITY_LIVE_FP_KEY: ${{ secrets.FIDELITY_LIVE_FP_KEY }}
        run: |
          umask 077
          printf '%s' "$QMB_FIDELITY_PROFILES_JSON" > "$RUNNER_TEMP/fidelity-profiles.json"
          python scripts/fidelity_launch.py -- python exec/fidelity_login_probe.py --pin "$PIN" \
            --state "$QMB_STATE_DIR" --profiles "$RUNNER_TEMP/fidelity-profiles.json"
      - name: Persist the probe record even after a failed probe
        if: ${{ always() }}
        working-directory: qmb
        run: bash ops/persist_state.sh "$GITHUB_WORKSPACE/state" fidelity-login-probe
      - name: Alert Camden on any failed probe
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue create -R "${{ github.repository }}" --title "fidelity-login-probe failed"
          --body "Login probe only. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Inspect private state."
