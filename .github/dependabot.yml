version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
  - package-ecosystem: "npm"
    directory: "/reports/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
