name: Loop review

# Spec 045 FR-011. Review-only: comments on loop/* PRs, never approves, never
# edits, runs no PR code. Instructions come from main's
# docs/autonomy/review-prompt.md, so a PR cannot rewrite its own reviewer.
#
# A PR opened with the default GITHUB_TOKEN does not trigger `pull_request`
# runs here freely (docs/autonomy/token-options.md). Until spec 045 D-2 is
# settled, Camden can run this by hand with the PR number.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of an open loop/* pull request
        required: true
        type: number

permissions: {}

concurrency:
  group: loop-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'cstroh01/Quant-ML-Bot' && (
        (github.event_name == 'pull_request' &&
         startsWith(github.event.pull_request.head.ref, 'loop/') &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         !github.event.pull_request.draft) ||
        (github.event_name == 'workflow_dispatch' &&
         github.actor == 'cstroh01' && github.triggering_actor == 'cstroh01'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          read -r state branch head cross < <(gh pr view "$NUMBER" --repo "$REPO" \
            --json state,headRefName,headRefOid,isCrossRepository \
            --jq '[.state, .headRefName, .headRefOid, .isCrossRepository] | @tsv')
          if [ "$state" != OPEN ] || [ "$cross" != false ] || ! [[ "$branch" =~ ^loop/[A-Za-z0-9_-]+$ ]]; then
            echo "::error::#$NUMBER is not an open same-repo loop/* PR"
            exit 1
          fi
          main_sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          {
            echo "number=$NUMBER"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"
          {
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$REPO/contents/docs/autonomy/review-prompt.md?ref=$main_sha"
            printf '\n\n## Run context (generated by loop-review.yml)\n\n- REPO: %s\n- PR NUMBER: %s\n- HEAD: %s\n' \
              "$REPO" "$NUMBER" "$head"
          } > "$RUNNER_TEMP/prompt.md"
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "prompt<<$delim"
            cat "$RUNNER_TEMP/prompt.md"
            echo
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # Files to read, not code to run: no dependency install, no pytest.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head }}
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.pr.outputs.prompt }}
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,LS,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Write,Edit,MultiEdit,NotebookEdit,Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh api:*),Bash(git:*),Bash(python:*),WebFetch,WebSearch"
